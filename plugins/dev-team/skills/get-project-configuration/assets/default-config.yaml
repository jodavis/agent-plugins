developer-standards:
  README.md: "If this file exists, read it — project overview and usage"
  CONTRIBUTING.md: "If this file exists, read it — contribution guidelines and code conventions"
  DEVELOPMENT.md: "If this file exists, read it — development setup and workflow"
  STYLE.md: "If this file exists, read it — code style guide"
  STYLEGUIDE.md: "If this file exists, read it — code style guide"
  HACKING.md: "If this file exists, read it — contributor/internals notes"
  CLAUDE.md: "If this file exists, read it — Claude Code project instructions"
  AGENTS.md: "If this file exists, read it — agent-facing project instructions"
  .github/CONTRIBUTING.md: "If this file exists, read it — contribution guidelines and code conventions"
  .github/copilot-instructions.md: "If this file exists, read it — Copilot-facing project instructions"
  .cursorrules: "If this file exists, read it — Cursor-facing project instructions"
  .editorconfig: "If this file exists, read it — the authoritative code style specification; follow every rule exactly (indentation, tab width, line endings, charset, trailing whitespace, final newlines, and any file-type overrides), no exceptions"

work-tracking:

documentation:
  format: Markdown
  architecture:
    location: docs/
    search: find docs -type f -name "*.md"
    name-format: <slug>.md
  specs:
    location: specs/
    name-format: <slug>_Design.md
    search: grep -l "<work-item-id>" specs/*_Design.md
  dev-specs:
    location: specs/
    name-format: <slug>_Spec.md
    search: grep -l "<work-item-id>" specs/*_Spec.md

validation:
  script: scripts/validate.sh

testing:
  test-file-patterns:
    - test_*.py
    - "*_test.py"

concurrency:
  max-parallel-tasks: 3

git-repo:
  user-alias: claude
  working-branches:
    task: dev/<user-alias>/<task-work-item-id>-<slug>
    feature: feature/<feature-work-item-id>-<slug>

instructions:
  before-debug:
  after-debug:
  before-research:
  after-research:
  before-implement:
    self-assign: Assign Jira work item to self
    transition: Transition Jira work item to "In Progress"
  after-implement:
  before-fix:
  after-fix:
  before-validate:
  after-validate-success:
    push: Push git changes to remote
  after-validate-failure:
  before-create-pr:
    ensure-pushed: If there are uncommitted changes, commit and push the branch
  after-create-pr:
    self-assign: Assign Jira work item to self
    transition: Transition Jira work item to "In Review"
  before-review:
  after-review:
  before-hand-off:
  after-hand-off:
    promote: Promote GitHub PR to ready for review
    request-review: Request a GitHub review from <default reviewer name>
    assign-work-item: Assign work item to <default reviewer email>
