name: Devcontainer Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
    - uses: actions/checkout@v4

    - name: Decide whether validation is needed
      id: decide
      env:
        BASE_REF: ${{ github.base_ref }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [[ "$EVENT_NAME" == "push" ]] || [[ "$BASE_REF" == "main" ]]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git fetch origin "$BASE_REF" --depth=1
        if git diff --name-only "origin/$BASE_REF" HEAD \
            | grep -qE '^\.devcontainer/'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi

  devcontainer-validate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compute lowercase image name
      id: image
      run: |
        echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/devcontainer" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and validate devcontainer
      uses: devcontainers/ci@v0.3
      with:
        imageName: ${{ steps.image.outputs.name }}
        cacheFrom: ${{ steps.image.outputs.name }}
        runCmd: bash scripts/validate.sh
